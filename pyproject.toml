[project]
name = "cqg-test"
version = "0.1.0"
description = "CLI text-replacement and sorting utility built as an SDET technical challenge."
readme = "README.md"
authors = [
    { name = "Jose Luis Cambil", email = "joseluiscc103@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
cqg-test = "cqg_test.main:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--cov=cqg_test --cov-report=term-missing"

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
